name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install Tectonic
        run: |
          curl -fsSL -o /tmp/tectonic.tgz "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-musl.tar.gz"
          echo "8533d07f9ccbd7a65824b9e0459041bca34af1eb33daba48f59215593753a3b7  /tmp/tectonic.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/tectonic.tgz -C /usr/local/bin tectonic
          tectonic --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t raft-review:ci .
      - name: Smoke test
        run: |
          docker run -d --name rr -e RAFT_REVIEW_DEV_LOGIN=1 -e PUBLIC_URL=http://localhost:8787 -p 8787:8787 raft-review:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8787/healthz && break; sleep 1; done
          curl -fsS http://localhost:8787/healthz | grep '"compiler":"tectonic"'
          docker logs rr
